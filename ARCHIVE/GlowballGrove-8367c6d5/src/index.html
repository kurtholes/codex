<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"> <title>Glowball Grove</title><link rel="stylesheet" href="style.css"></head><body><canvas id="world"></canvas><div id="vignette"></div><header><div class="brand"><small>THE MOONLIT GARDEN</small><h1>Glowball Grove<span>✦</span></h1></div><div class="top"><button id="mode">↗ Quick roll</button><select id="quality" aria-label="Graphics quality"><option value="auto">Auto quality</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select><button id="sound" aria-label="Toggle sound">♫</button></div></header><aside><span class="eyebrow" id="modeLabel">YOUR GROWING GARDEN</span><div class="currency">✦ <b id="glow">0</b></div><div class="sub"><span id="income">0</span> <span id="rateUnits">glow / min</span> <span class="dot">•</span> <span id="groves">0</span> groves</div></aside><div id="toast"></div><div id="research" hidden><div class="panelhead"><div><small>BOTANICAL RESEARCH</small><h2>Grow a little wilder.</h2></div><button id="close">×</button></div><div id="branches"></div></div><footer><div class="controls"><span><kbd>W A S D</kbd> Roll</span><span><kbd>SHIFT</kbd> Surge</span><span><kbd>SPACE</kbd> Hop</span><span><kbd>E</kbd> Plant</span><span><kbd>TAB</kbd> Evolve</span></div><div class="bottom"><div id="ballLabel">✺ POLLEN SEED <span id="size">1.0 m</span></div><button id="evolve">✧ Botanical research <span>↗</span></button></div><div class="meter"><i id="charge"></i></div></footer><div id="touch"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button data-key="Shift">⚡</button><button data-key="e">✿</button></div><script type="module" src="game.js"></script></body></html>
