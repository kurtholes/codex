<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sloppin — a very muddy sandbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#232724;color:#ede9d8;font-family:Arial,sans-serif;overflow:hidden}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}header{position:absolute;top:28px;left:34px}h1{font-size:37px;letter-spacing:8px;margin:0;font-weight:900}small{font-size:10px;letter-spacing:4px;color:#b8bdac}.stats{position:absolute;right:32px;top:27px;text-align:right}.number{font-size:35px;font-weight:800;color:#ded6a0}#zone{position:absolute;top:110px;left:36px;color:#bfc3af;font-size:11px;letter-spacing:3px}#tip{position:absolute;bottom:91px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:3px;white-space:nowrap}nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5;pointer-events:auto;white-space:nowrap}button,select{background:#202721dd;border:1px solid #7f897166;color:#e4e5cc;padding:12px 16px;border-radius:3px;cursor:pointer;font:11px Arial;letter-spacing:1px}button:hover{background:#586348}kbd{background:#9ca58524;padding:3px 5px;margin-right:5px}#panel{position:absolute;right:28px;top:135px;width:280px;max-height:calc(100vh - 230px);overflow-y:auto;background:#182019ee;border:1px solid #77836a77;padding:20px;pointer-events:auto;display:none}#panel h2{font-size:15px;letter-spacing:3px;margin-top:0}#upgrades button{display:block;width:100%;text-align:left;margin:7px 0;padding:11px}#upgrades span{float:right;color:#d7ca88}#toast{position:absolute;top:25%;width:100%;text-align:center;font-size:25px;letter-spacing:3px;text-shadow:0 3px 12px #000;transition:opacity .3s;opacity:0}#meter{position:absolute;bottom:76px;left:35px;width:160px;height:3px;background:#434a3c}#meter i{display:block;background:#c2c996;height:100%;width:100%}#quality{position:absolute;bottom:28px;right:28px;pointer-events:auto}#touch{display:none;position:absolute;bottom:130px;left:20px;pointer-events:auto}#touch button{padding:20px}#sandbox{display:none;margin-top:14px;font-size:11px}input{width:100%;accent-color:#a9b98c}#scorePop{position:absolute;left:52%;top:43%;font-size:34px;font-weight:900;color:#e2d794;opacity:0;transition:opacity .3s}#vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px #10191299;pointer-events:none}@media(pointer:coarse){#touch{display:block}nav{bottom:15px}nav button{padding:10px 7px}header{left:18px}#quality{display:none}}
</style></head><body><div id="hud"><header><small>A VERY MUDDY SANDBOX</small><h1>SLOPPIN</h1></header><div class="stats"><small id="mode">YOUR PERSONAL WALLOW</small><div class="number"><span id="feed">0</span> <span style="font-size:13px">FEED</span></div><small id="mass">380 KG</small></div><div id="zone">01 / CABBAGE LOWLANDS</div><div id="toast"></div><div id="scorePop"></div><div id="tip">WASD · MOVE &nbsp; SPACE · ROOT</div><div id="meter"><i></i></div><nav><button id="root"><kbd>SPACE</kbd>Root</button><button id="toss"><kbd>E</kbd>Toss</button><button id="charge"><kbd>⇧</kbd>Charge</button><button id="evolve"><kbd>U</kbd>Evolve</button><button id="quick">Wallow sandbox</button></nav><select id="quality" aria-label="Graphics quality"><option value="auto">Auto graphics</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select><div id="panel"><h2>EVOLVE YOUR PIG</h2><div id="upgrades"></div><div id="sandbox">MUD DEPTH<input id="mud" aria-label="Mud depth" type="range" min="0" max="1" step=".05" value=".4"><button id="reset">Fresh farm ↻</button></div></div><div id="touch"><button data-key="w">▲</button><br><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div></div><div id="vignette"></div><script type="module" src="game.js"></script></body></html>
