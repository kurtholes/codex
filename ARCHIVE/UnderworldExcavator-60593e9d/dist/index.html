<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23190e"><title>Underworld Excavator</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world"></canvas><div id="vignette"></div>
<header><div class="brand"><span class="eyebrow">THE BURIED CITY</span><h1>UNDERWORLD<span>EXCAVATOR</span></h1><div class="district"><i></i><span id="district">01 / SUN GALLERY</span></div></div><div class="right"><div class="stone"><span class="rock">⬡</span><span id="stone">0</span><small>STONE</small></div><div id="rushClock"></div><button id="forgeButton">◈ &nbsp; FORGE <kbd>Tab</kbd></button></div></header>
<div id="reticle"><b></b><span></span></div><div id="numbers"></div><div id="toast"></div><div id="hint"><span class="mouse">◉</span> HOLD · CHARGE · RELEASE</div>
<div id="discovery"><small>DISTRICT UNCOVERED</small><strong></strong></div>
<footer><div class="modes"><button class="active" id="mainMode">EXCAVATE</button><button id="rushMode">5 MIN RUSH ↗</button><button id="audio" aria-label="Toggle sound">♫</button><select id="quality" aria-label="Graphics quality"><option value="auto">AUTO</option><option value="low">LOW</option><option value="medium">MED</option><option value="high">HIGH</option></select></div><div class="chargeHUD"><div class="chargeLabels"><span>SEISMIC CANNON</span><span id="powerLabel">MK I</span></div><div class="chargeTrack"><div id="chargeFill"></div></div><div class="controls">WASD move &nbsp; ⇧ sprint &nbsp; SPACE jump <span id="movementHint"></span></div></div><div class="depth"><small>EXCAVATED</small><strong id="broken">000</strong><span id="depth">DEPTH 000 m</span></div></footer>
<section id="forge" hidden><div class="forgeTop"><div><small>FIELD WORKSHOP</small><h2>Shape your power.</h2></div><button id="closeForge">✕</button></div><div id="upgrades"></div><p>Stone feeds the machine.</p></section>
<div id="rushEnd" hidden><small>EXCAVATION COMPLETE</small><h2 id="rushScore"></h2><button id="again">ANOTHER DISTRICT ↗</button><button id="return">RETURN TO EXCAVATION</button></div>
<div id="touch"><button id="touchMove">↑</button><button id="touchFire">◉</button><button id="touchJump">↟</button></div>
<script type="module" src="game.js"></script></body></html>
