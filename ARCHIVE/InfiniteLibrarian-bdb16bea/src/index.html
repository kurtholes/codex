</style></head><body><div id="hud"><header><small>THE ENDLESS COLLECTION</small><h1>Infinite Librarian</h1></header><div id="modes"><button id="main">∞ ARCHIVE</button><button id="quick">◷ ONE SHIFT</button><button id="sound">♪ SOUND OFF</button></div><div id="stats"><div id="credits">◈ 0</div><div id="load">▤ 0 / 12</div><div id="shift" style="margin-top:12px;color:#d4ae77"></div></div><div id="center">Scoop. Fling. Repeat.</div><div id="floater"></div><div id="upgrades"></div><select id="quality" aria-label="Graphics quality"><option value="auto">Quality · Auto</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select><div id="meter"><div id="fill"></div></div><div id="bottom"><span><kbd>W A S D</kbd> MOVE</span><span><kbd>CLICK</kbd> FLING</span><span><kbd>SHIFT</kbd> GRIND</span><span><kbd>E</kbd> LIFT</span><span><kbd>R</kbd> SHOVE</span><span><kbd>Q</kbd> JUMP</span><span><kbd>DRAG</kbd> LOOK</span></div><div id="touch"><button data-key="w">↑</button><br><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button><button id="touchfling">▤ ↗</button></div><div id="dev"></div></div><script type="module" src="./game.js"></script></body></html>
