<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Wilds</title><style>

*{box-sizing:border-box}body{margin:0;background:#020605;color:#fff6d6;font-family:Arial,sans-serif;overflow:hidden}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:28px 34px}header{display:flex;justify-content:space-between;align-items:start}.brand{font-size:13px;letter-spacing:5px;color:#77e9be}.brand b{display:block;color:#fff6d6;font-size:30px;letter-spacing:1px;margin-top:7px}.badge{font-size:12px;letter-spacing:2px;color:#b1bfb5}.stats{margin-top:30px;font-size:13px;color:#a8c6b4}.stats strong{display:block;font-size:34px;color:#ffdb39;margin:7px 0}.bottom{position:absolute;bottom:28px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:end}.keys{font-size:11px;letter-spacing:1px;color:#abc8bb;line-height:2}kbd{border:1px solid #547363;padding:4px 7px;border-radius:5px;color:white;margin-right:4px}.actions{display:flex;gap:8px;pointer-events:auto}button,select{background:#10251fdd;border:1px solid #527665;color:#ecffe7;padding:12px 17px;border-radius:30px;cursor:pointer;font:12px Arial;letter-spacing:1px}button:hover{background:#265645}#toast{position:absolute;top:20%;width:100%;left:0;text-align:center;color:#ffdc35;letter-spacing:3px;font-size:20px;transition:opacity .3s}#speed{font-size:42px;font-weight:bold}#speed small{font-size:10px;font-weight:normal;letter-spacing:2px;color:#90b9a6}#shop{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#061710f5;border:1px solid #5cffab;border-radius:18px;padding:30px;width:540px;max-width:94vw;box-shadow:0 0 100px #24ff8940}#shop h2{font-size:24px;margin:0 0 8px}#shop p{color:#9cbdab;font-size:12px}#branches{display:grid;grid-template-columns:1fr 1fr;gap:10px}#branches button{text-align:left;border-radius:12px;padding:20px;line-height:1.8}#branches b{color:#ffdb39;font-size:18px}#close{float:right}#cross{position:fixed;left:50%;top:50%;color:#a4ffd980;font-size:20px;pointer-events:none}#fps{position:fixed;top:5px;left:5px;font:11px monospace;color:#fff}.float{position:fixed;color:#ffdd2e;font-weight:bold;font-size:24px;pointer-events:none;animation:rise .8s forwards}@keyframes rise{to{transform:translateY(-90px);opacity:0}}
</style></head><body><div id="hud"><header><div class="brand">MIDNIGHT GARDEN / 01<b>NEON WILDS</b></div><div class="badge" id="mode">FREE GARDEN · ∞</div></header><div class="stats">GOLDEN SAP<strong id="sap">0</strong><span id="pins">◌ ◌ ◌ &nbsp; ROUTES</span></div><div id="toast">CARVE YOUR OWN WAY</div><div class="bottom"><div class="keys"><kbd>W A S D</kbd> CARVE &nbsp; <kbd>SPACE</kbd> LEAP<br><kbd>SHIFT / CLICK</kbd> PRUNE &nbsp; <kbd>E</kbd> GRIND &nbsp; <kbd>U</kbd> GRAFT</div><div id="speed">0 <small>LEAF / SEC</small></div><div class="actions"><button id="quick">↗ QUICK RUN</button><button id="graft">✳ GRAFT</button><select id="quality"><option value="auto">AUTO</option><option value="low">LOW</option><option value="med">MED</option><option value="high">HIGH</option></select><button id="sound">♪ ON</button></div></div></div><div id="cross">·</div><div id="shop"><button id="close">✕</button><h2>Living grafts</h2><p id="balance"></p><div id="branches"></div></div><script type="module" src="./game.js"></script></body></html>
