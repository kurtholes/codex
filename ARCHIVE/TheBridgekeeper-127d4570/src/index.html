<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bridgekeeper</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151f;color:#e9dec3;font-family:Georgia,serif;overflow:hidden}canvas{display:block}#veil{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse,transparent 35%,#090b16a0);box-shadow:inset 0 0 100px #080a15}header{position:fixed;top:26px;left:32px;pointer-events:none}h1{font-size:21px;letter-spacing:7px;margin:0 0 8px;font-weight:normal}small{font:10px sans-serif;letter-spacing:4px;color:#94a3af}.meter{width:190px;height:3px;background:#46505a;margin-top:15px}.meter b{height:100%;display:block;background:#ffbc5e;box-shadow:0 0 10px #ff9a32}#stats{position:fixed;right:30px;top:26px;text-align:right;font:13px sans-serif;letter-spacing:2px}#salvage{font:30px Georgia;color:#ffc46c}#reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffcf7d;font:32px serif;pointer-events:none}#hint{position:fixed;bottom:112px;width:100%;text-align:center;font:11px sans-serif;letter-spacing:3px;color:#cfcbc0;pointer-events:none}#dock{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:7px}button,select{background:#111d27db;color:#c0c8cd;border:1px solid #59616b;padding:10px 13px;cursor:pointer;font:11px sans-serif;letter-spacing:1px}button:hover{border-color:#ffbe62;color:#ffbe62;background:#28313b}button b{display:block;font:20px Georgia;margin-bottom:4px;color:#ffbd65}button small{font:9px sans-serif;letter-spacing:0;color:#8a9aa7}#modes{position:fixed;right:25px;bottom:28px;display:flex;gap:6px}#modes button{padding:8px}#toast{position:fixed;top:24%;width:100%;text-align:center;color:#ffd08a;font:23px Georgia;letter-spacing:4px;pointer-events:none;opacity:0;transition:opacity .2s}#numbers{position:fixed;inset:0;pointer-events:none}.num{position:absolute;color:#ffd07b;font:bold 26px Georgia;text-shadow:0 2px 6px #000;animation:rise 1s forwards}@keyframes rise{to{transform:translateY(-80px);opacity:0}}#bar{position:fixed;bottom:94px;left:50%;width:170px;transform:translateX(-50%);height:2px;background:#28303a}#bar b{display:block;height:100%;background:#ffc36a}#fps{position:fixed;top:90px;right:30px;font:12px monospace} @media(max-width:800px){#dock{left:10px;transform:none;gap:2px}button{padding:8px 6px}#modes{top:100px;bottom:auto;right:12px;flex-direction:column}h1{font-size:15px}header{left:15px}#hint{font-size:9px}}
</style></head><body><div id="veil"></div><header><h1>THE BRIDGEKEEPER</h1><small id="area">THE DROWNED SPAN</small><div class="meter"><b id="health"></b></div></header><div id="stats"><div id="salvage">◈ 0</div><p id="wave">STORM I</p></div><div id="reticle">+</div><div id="toast"></div><div id="numbers"></div><div id="hint">WASD · HOLD/RELEASE FIRE · SPACE · R REPAIR</div><div id="bar"><b></b></div><div id="dock"></div><div id="modes"><button id="mode">5:00 SIEGE</button><select id="quality"><option>Auto</option><option>Low</option><option>Med</option><option>High</option></select><button id="sound">♫ ON</button></div><script type="module" src="game.js"></script></body></html>
