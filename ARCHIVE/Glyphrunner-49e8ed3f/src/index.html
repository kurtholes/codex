<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glyphrunner</title><style>

*{box-sizing:border-box}body{margin:0;background:#071619;color:#e5f3cf;font-family:Georgia,serif;overflow:hidden}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}header{position:absolute;top:28px;left:34px}small{font:10px sans-serif;letter-spacing:4px;color:#7ea9a6}h1{font-size:29px;letter-spacing:7px;margin:7px 0;font-weight:normal}.rule{width:58px;height:1px;background:#a4bd75;margin:15px 0}#region{font:11px sans-serif;letter-spacing:3px;color:#94b4af}#stats{position:absolute;top:30px;right:32px;text-align:right}#energy{font-size:32px;color:#d9f8aa}#beacons{font:11px sans-serif;letter-spacing:2px;margin-top:9px}#bar{width:140px;height:3px;background:#28413b;margin-top:13px}#health{height:100%;background:#c7e99d}#reticle{position:absolute;left:50%;top:48%;color:#c2f6ca66;font-size:23px}#bottom{position:absolute;bottom:25px;left:34px;right:34px;display:flex;align-items:end;justify-content:space-between}#controls{font:11px sans-serif;letter-spacing:1px;line-height:2;color:#b0c4bd}kbd{border:1px solid #839b8955;padding:5px 8px;color:#ecf8d3;margin-right:5px}button{pointer-events:auto;background:#102b2bd9;color:#d7eabd;border:1px solid #698b7255;padding:12px 17px;cursor:pointer;font:11px sans-serif;letter-spacing:2px}button:hover{background:#315445}#toast{position:absolute;top:24%;width:100%;text-align:center;font-size:26px;letter-spacing:6px;transition:opacity .3s;opacity:0;text-shadow:0 0 22px #c5ffa3}#hint{position:absolute;bottom:105px;width:100%;text-align:center;font:11px sans-serif;letter-spacing:3px;color:#ceebba}#panel{position:absolute;inset:10% 14%;background:#071c20f2;border:1px solid #729c7855;padding:28px;display:none;pointer-events:auto;overflow:auto;backdrop-filter:blur(12px)}#panel h2{font-weight:normal;letter-spacing:6px}#branches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px} .branch{border-top:1px solid #7ba58b;padding-top:15px}.branch p{font:12px sans-serif;color:#8ea9a3;line-height:1.8}.branch button{width:100%;m
