name: Deploy Vesper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run game tests
        run: npm test
      - name: Build for this repository's Pages URL
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            npm run build -- --base=/
          else
            npm run build -- --base="/$REPOSITORY_NAME/"
          fi
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
